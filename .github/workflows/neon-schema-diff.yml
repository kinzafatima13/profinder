name: Neon schema diff (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PostgreSQL runtime branch
        uses: actions/checkout@v4
        with:
          ref: fix/neon-postgres-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare Neon schema with Prisma schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is not configured."
            exit 1
          fi

          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script
