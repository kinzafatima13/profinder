name: Next.js build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and build
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
        run: |
          npm install
          npx prisma generate
          npm run build
