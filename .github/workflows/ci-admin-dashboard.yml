
name: CI - Admin Dashboard Validation

on:
  push:
    branches:
      - feat/admin-dashboard-phase1
  pull_request:
    branches:
      - feat/admin-dashboard-phase1

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profinder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profinder_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_OPTIONS: --max_old_space_size=4096
      NEXTAUTH_SECRET: ci-only-development-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profinder_ci?schema=public
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push Prisma schema to CI database
        run: npm run db:push

      - name: Build Next.js application
        run: npx next build

      - name: Run tests
        run: npm run test
