name: Recovery Dry-Run Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default) or write (requires CONFIRM_MIGRATE)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety unit tests
        run: python scripts/test-recovery-safety.py
      - name: Read-only SQLite source counts
        run: |
          python - << 'PY'
          import sqlite3, os, json
          path = "prisma/dev.db"
          if not os.path.exists(path):
              print("ERROR: prisma/dev.db missing")
              exit(1)
          c = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          tables = [
            "University","Program","Professor","Publication","Scholarship","ResearchArea",
            "ProfessorResearchArea","ProfessorSource","ProfessorTopic","Topic","Student","Application"
          ]
          out = {}
          for t in tables:
              try:
                  out[t] = c.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0]
              except Exception as e:
                  out[t] = f"ERROR: {e}"
          print(json.dumps(out, indent=2))
          print("integrity:", c.execute("PRAGMA integrity_check").fetchone()[0])
          open("source-counts.json","w").write(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-counts
          path: source-counts.json

  dry-run:
    needs: validate-source
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install driver
        run: pip install "psycopg[binary]"
      - name: Fail closed if secret missing
        env:
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
        run: |
          if [ -z "$RECOVERY_DATABASE_URL" ]; then
            echo "RECOVERY_DATABASE_URL secret is not set."
            exit 1
          fi
          echo "Secret present."
      - name: Dry-run only (no persistent writes)
        env:
          DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
          DRY_RUN: "1"
          SQLITE_PATH: prisma/dev.db
        run: python scripts/migrate-sqlite-to-postgres.py | tee recovery-dry-run-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-dry-run-report
          path: recovery-dry-run-report.txt

  write:
    needs: validate-source
    if: inputs.mode == 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install driver
        run: pip install "psycopg[binary]"
      - name: Fail closed if secret missing
        env:
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
        run: |
          if [ -z "$RECOVERY_DATABASE_URL" ]; then
            echo "RECOVERY_DATABASE_URL secret is not set."
            exit 1
          fi
          echo "Secret present. Proceeding with write."
      - name: Write (idempotent, ON CONFLICT DO NOTHING)
        env:
          DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
          CONFIRM_MIGRATE: preserve-ids
          SQLITE_PATH: prisma/dev.db
        run: python scripts/migrate-sqlite-to-postgres.py | tee recovery-write-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-write-report
          path: recovery-write-report.txt
