name: University pipeline tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/university-pipeline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Run adapter, normalization and validation tests
        env:
          PYTHONPATH: pipeline
        run: python -m unittest discover -s pipeline/tests -v
