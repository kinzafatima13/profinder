[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profinder-university-pipeline"
version = "0.1.0"
description = "Review-first university data collection and normalization for ProFinderNow"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["profinder_pipeline*"]
